steps:
  # 1. Build the Bot Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/qft-agent:$COMMIT_SHA', '.']
    dir: 'apps/qft-agent'  # 👈 Isolates the build to the agent folder

  # 2. Push the Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/qft-agent:$COMMIT_SHA']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'qft-agent'           # Service Name
      - '--image'
      - 'gcr.io/$PROJECT_ID/qft-agent:$COMMIT_SHA'
      - '--region'
      - 'us-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # 👇 CRITICAL FOR BOTS: Keeps the CPU awake so it stays online in Discord
      - '--no-cpu-throttling'
      - '--min-instances=1'
      # Environment variables for production
      - '--set-env-vars'
      - 'API_GATEWAY_URL=https://api-gateway-YOUR_HASH-uc.a.run.app'
      - '--set-secrets'
      - 'INTERNAL_BOT_SECRET=INTERNAL_BOT_SECRET:latest,BOT_TOKEN=BOT_TOKEN:latest' 

images:
  - 'gcr.io/$PROJECT_ID/qft-agent:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY